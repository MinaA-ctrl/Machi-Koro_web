# Machi Koro — Stage 3 production stack.
#
#   Caddy (auto-HTTPS edge)  →  /         frontend  (Next.js standalone :3000)
#                               /api/*    backend   (FastAPI REST :8001)
#                               /api/ws/* backend   (FastAPI WebSocket :8001)
#   Postgres  →  game state, accounts, entitlements, scores
#
# The old WordPress page-host + MySQL were retired (Stage 2 S2.7 / Stage 3); the
# Next.js frontend is now the page-host. See docker-compose.legacy.yml for the
# previous stack and Developer stages/stage-3-handoffs/deploy-prod.md to deploy.
#
# Reminder: backend AND frontend are BUILT images — `up` alone won't pick up code
# changes. After editing websocket-server/ or frontend/, run:
#   docker compose build backend frontend

services:

  # Game data, accounts, entitlements, scores. Backend runs Alembic on startup.
  postgres:
    image: postgres:16
    container_name: machikoro_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-machikoro}
      POSTGRES_USER: ${POSTGRES_USER:-machikoro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - machikoro_net

  # FastAPI app.main — REST + WebSocket + auth + engine. MK_ENV=prod makes the
  # backend refuse to boot on a missing/insecure secret.
  backend:
    build:
      context: ./websocket-server
      dockerfile: Dockerfile.backend
    container_name: machikoro_backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-machikoro}
      DB_USER: ${POSTGRES_USER:-machikoro}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MK_ENV: prod                       # enforces real secrets + rate limiting
      MK_JWT_SECRET: ${MK_JWT_SECRET}     # required (boot fails if unset/insecure)
      MK_WS_SECRET: ${MK_WS_SECRET}       # required; same value the WS token uses
    depends_on:
      - postgres
    networks:
      - machikoro_net

  # Next.js 14 standalone server (Stage 3 frontend). Talks to the backend
  # same-origin via Caddy (/api), so no public host port — only Caddy reaches it.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: machikoro_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - machikoro_net

  # Edge reverse proxy with automatic Let's Encrypt TLS. SITE_DOMAIN must resolve
  # to this host (A record, DNS-only) for the ACME challenge to succeed.
  caddy:
    image: caddy:2-alpine
    container_name: machikoro_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-machi-koro.pima.kz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - machikoro_net

volumes:
  pg_data:        # Postgres — the game backend's data
  caddy_data:     # Caddy — issued certificates + ACME account
  caddy_config:

networks:
  machikoro_net:
